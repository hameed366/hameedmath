<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>متابعة درجات الرياضيات</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#1b2333;--mut:#6b7488;--line:#e1e5ee;--pri:#1f3864;--acc:#2f6fed;--ok:#1e9e5a;--warn:#e6a100;--bad:#d64545;--chip:#e8eefc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131c;--card:#1a2030;--ink:#eef1f8;--mut:#9aa4ba;--line:#2a3247;--pri:#9db8f2;--acc:#6a9bff;--chip:#25304d}}
:root[data-theme="dark"]{--bg:#0f131c;--card:#1a2030;--ink:#eef1f8;--mut:#9aa4ba;--line:#2a3247;--pri:#9db8f2;--acc:#6a9bff;--chip:#25304d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Arabic","Geeza Pro",Tahoma,Arial,sans-serif;font-size:16px}
.app{height:100%;display:grid;grid-template-columns:1fr}
.list,.detail{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.list{background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column}
.top{padding:16px 16px 8px;position:sticky;top:0;background:var(--card);z-index:2}
h1{font-size:20px;margin:0 0 10px;color:var(--pri);display:flex;align-items:center;gap:8px}
h1 .thbtn{margin-inline-start:auto;background:var(--chip);border-radius:10px;padding:6px 10px;font-size:16px;color:var(--pri)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;min-width:0}
select.sortsel{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;font:inherit;font-size:13px}
button{font:inherit;border:0;cursor:pointer;color:inherit}
.add{background:var(--acc);color:#fff;border-radius:12px;padding:0 16px;font-weight:700}
.stu{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;text-align:start;position:relative}
.stu.on{background:var(--chip)}
.av{width:42px;height:42px;border-radius:50%;background:var(--chip);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none;position:relative;overflow:hidden;background-size:cover;background-position:center}
.av.img{color:transparent}
.badge{position:absolute;top:-6px;inset-inline-start:-6px;font-size:18px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));z-index:2}
.stu .n{flex:1;min-width:0}.stu .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .4s ease,background .3s}
.bar.lo i{background:var(--bad)}.bar.mid i{background:var(--warn)}.bar.hi i{background:var(--ok)}
.tot{font-weight:800;font-variant-numeric:tabular-nums;color:var(--pri)}.tot small{color:var(--mut);font-weight:500}
.tot.hi{color:var(--ok)}.tot.lo{color:var(--bad)}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.detail{padding:16px;display:none}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hd h2{flex:1;margin:0;font-size:22px;min-width:0}
.ib{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px}
.back{display:inline-block}
.ib.wa{color:#25D366}
.bigav{width:90px;height:90px;border-radius:50%;background:var(--chip);color:var(--pri);display:grid;place-items:center;font-size:36px;font-weight:800;margin:0 auto 14px;overflow:hidden;background-size:cover;background-position:center;position:relative;cursor:pointer;border:3px solid var(--card);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.bigav .cam{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;text-align:center;padding:3px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.tile .v{font-size:24px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}.tile .v small{font-size:13px;color:var(--mut)}
.tile .l{font-size:12px;color:var(--mut);margin-top:2px}
.tile.big{background:var(--pri);border-color:var(--pri)}.tile.big .v,.tile.big .l{color:#fff}.tile.big .v small{color:#ffffffb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile.big .v,:root:not([data-theme="light"]) .tile.big .l{color:#0f131c}:root:not([data-theme="light"]) .tile.big .v small{color:#0f131c99}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:17px;display:flex;justify-content:space-between;color:var(--pri)}
.g{margin-top:12px}.g>b{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.it span{flex:1;font-size:15px;line-height:1.35}
.st{display:flex;align-items:center;gap:6px;flex:none}
.st button{width:36px;height:36px;border-radius:50%;background:var(--chip);color:var(--pri);font-size:20px;font-weight:700;line-height:1}
.st output{min-width:62px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}.st output small{color:var(--mut);font-weight:500}
.seg{display:flex;gap:6px}.seg button{padding:8px 14px;border-radius:10px;background:var(--chip);color:var(--pri);font-weight:700}
.seg button.y{background:var(--ok);color:#fff}.seg button.x{background:var(--bad);color:#fff}
.notes{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:inherit;min-height:70px;resize:vertical;font-size:14px}
.hint{font-size:12px;color:var(--mut);text-align:center;margin:8px 0 24px}
@media (max-width:799px){
 .app.sel .list{display:none}.app.sel .detail{display:block}
 .app:not(.sel) .detail{display:none}
}
@media (min-width:800px){
 .app{grid-template-columns:360px 1fr}.detail{display:block}.back{display:none}
 .tiles{max-width:720px}.card{max-width:720px}
}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--ink);width:min(480px,92vw);padding:20px;font:inherit}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 12px;color:var(--pri)}
dialog .b{display:block;width:100%;padding:13px;border-radius:12px;background:var(--chip);color:var(--pri);font-weight:700;margin-bottom:10px}
dialog .b.p{background:var(--acc);color:#fff}
dialog textarea{width:100%;height:96px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:inherit;margin-bottom:10px;resize:none}
dialog hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.chips{display:flex;gap:8px;margin-bottom:12px}.chip{flex:1;padding:11px 6px;border-radius:12px;background:var(--chip);color:var(--pri);font-weight:700;font-size:14px}.chip.on{background:var(--acc);color:#fff}.chip:disabled{opacity:.4}
.fld{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;font:inherit;margin-bottom:10px}
#ai{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:inherit;margin-bottom:12px}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pri);color:var(--card);padding:12px 16px;border-radius:12px;display:none;z-index:9;text-align:center}
#pt{display:none}
@media print{.list,.back,.hd .ib,.st button,.hint,#toast,.bigav .cam{display:none!important}.app{display:block;height:auto}.detail{display:block!important;height:auto;overflow:visible;padding:0}body{background:#fff;color:#000}.card,.tile{break-inside:avoid;border-color:#999}body.pa .app{display:none}body.pa #pt{display:block}#pt h2{text-align:center}#pt table{width:100%;border-collapse:collapse}#pt td,#pt th{border:1px solid #000;padding:6px;text-align:center}.pb{page-break-before:always}}
#msg{min-height:20px;font-size:14px;color:var(--mut);margin-bottom:8px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat-t{background:var(--chip);border-radius:14px;padding:12px;text-align:center}
.stat-t .sv{font-size:24px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
.stat-t .sl{font-size:12px;color:var(--mut);margin-top:3px}
.dist{display:grid;gap:8px;margin-bottom:14px}
.dist-row{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.dist-bar{height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.dist-bar i{display:block;height:100%;background:var(--acc);transition:width .6s ease}
.dist-row.g .dist-bar i{background:var(--ok)}
.dist-row.w .dist-bar i{background:var(--warn)}
.dist-row.b .dist-bar i{background:var(--bad)}
.top3{display:grid;gap:8px;margin-bottom:14px}
.top3-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--chip);border-radius:12px;font-size:14px}
.top3-row b{flex:1}
</style>
</head>
<body>
<div class="app" id="app">
 <aside class="list">
  <div class="top">
   <h1>🧮 متابعة الرياضيات <button class="thbtn" id="thbtn" aria-label="تبديل الوضع">🌓</button></h1>
   <div class="row">
     <input type="search" id="q" placeholder="ابحث عن طالب">
     <select class="sortsel" id="sortsel" aria-label="ترتيب">
       <option value="entry">ترتيب الإدخال</option>
       <option value="name">بالاسم (أ-ي)</option>
       <option value="total-d">الأعلى درجة</option>
       <option value="total-a">الأدنى درجة</option>
     </select>
   </div>
   <div class="row" style="margin-top:8px">
     <button class="add" id="add" style="flex:1">+ طالب جديد</button>
     <button class="ib" id="stats" aria-label="إحصائيات" title="لوحة الإحصائيات">📊</button>
     <button class="ib" id="tools" aria-label="استيراد وتصدير" title="استيراد/تصدير">⇅</button>
   </div>
  </div>
  <div id="ls"></div>
 </aside>
 <main class="detail" id="dt"></main>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>
<dialog id="ask"><h3 id="at"></h3><input id="ai" type="text"><button class="b p" id="aok">موافق</button><button class="b" id="acn">إلغاء</button></dialog>

<dialog id="pdlg"><h3>طباعة</h3>
<div class="chips"><button class="chip" data-k="class">كشف الدرجات (كل الطلاب)</button><button class="chip" data-k="student" id="pst">تقرير الطالب</button></div>
<input class="fld" id="pc" placeholder="الصف / الشعبة (تظهر في الترويسة)">
<input class="fld" id="pteach" placeholder="اسم المعلم">
<button class="b p" id="pnow">🖨 طباعة الآن</button>
<button class="b" id="psave">💾 حفظ كملف HTML</button>
<div id="pmsg" style="min-height:18px;font-size:13px;color:var(--mut);margin-bottom:8px"></div>
<button class="b" id="pcl">إغلاق</button></dialog>

<dialog id="dlg"><h3>استيراد وتصدير</h3>
<button class="b" id="imp">استيراد أسماء من ملف إكسل (xlsx / csv)</button>
<input type="file" id="fi" accept=".xlsx,.xls,.csv" hidden>
<textarea id="ta" placeholder="أو الصق الأسماء هنا (اسم في كل سطر)"></textarea>
<button class="b" id="pa">إضافة الأسماء الملصوقة</button><hr>
<button class="b" id="bulkOpen">⚡ ملء جماعي (تعيين درجة لكل الطلاب)</button>
<button class="b" id="prt">طباعة كشف الدرجات / PDF</button>
<button class="b p" id="ex">📥 تصدير الدرجات إلى Excel</button>
<div id="msg"></div><button class="b" id="cl">إغلاق</button></dialog>

<dialog id="bulk"><h3>⚡ ملء جماعي</h3>
<p style="font-size:13px;color:var(--mut);margin:0 0 10px">عيّن قيمة واحدة لكل الطلاب في بند معين.</p>
<select class="fld" id="bulkItem"></select>
<input class="fld" id="bulkVal" type="number" step="0.5" min="0" placeholder="القيمة (مثلاً 2)">
<button class="b p" id="bulkGo">تطبيق على جميع الطلاب</button>
<button class="b" id="bulkClear">مسح البند للجميع</button>
<button class="b" id="bulkClose">إغلاق</button>
</dialog>

<dialog id="statsDlg"><h3>📊 لوحة الإحصائيات</h3>
<div id="statsBody"></div>
<button class="b" id="statsClose" style="margin-top:14px">إغلاق</button>
</dialog>

<div id="toast"></div><div id="pt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CR=[
 {id:'1',title:'الأسابيع 1–6',max:15,gs:[
  {t:'المشاركة (4 درجات)',it:[['pa','التفاعل والمشاركة',2],['pb','الأدوات',1],['pc','مهارات التفكير العليا',1]]},
  {t:'الواجبات (4 درجات)',it:[['ha','صفي',2],['hb','لا صفي (عبر منصة تميز)',2]]},
  {t:'المشروع (4 درجات)',it:[['ja','تطبيق المهارة الرياضية بدقة',2],['jb','تنظيم وترتيب المشروع ووضع العرض',1],['jc','الالتزام بتنفيذ المشروع وتسليمه بالوقت المحدد',1]]},
  {t:'السلوك (3 درجات)',it:[['b','السلوك',3]]}]},
 {id:'2',title:'الأسابيع 7–12',max:15,gs:[
  {t:'المشاركة (4 درجات)',it:[['pa','التفاعل والمشاركة',2],['pb','الأدوات',1],['pc','مهارات التفكير العليا',1]]},
  {t:'الواجبات (4 درجات)',it:[['ha','صفي',2],['hb','لا صفي (عبر منصة تميز)',2]]},
  {t:'المشروع (4 درجات)',it:[['ja','تطبيق المهارة الرياضية بدقة',2],['jb','تنظيم وترتيب المشروع ووضع العرض',1],['jc','الالتزام بتنفيذ المشروع وتسليمه بالوقت المحدد',1]]},
  {t:'السلوك (3 درجات)',it:[['b','السلوك',3]]}]}
];
const QMAX=20;
let S=[],sel=null,term='',sortMode='entry',undoStack=[];
const $=id=>document.getElementById(id);

function load(){
 try{const d=JSON.parse(localStorage.getItem('mt1')||'null');if(d&&d.length){S=d;return}}catch(e){}
 S=[{id:1,name:'طالب تجريبي ١',v:{'1_pa':2,'1_pb':1,'1_pc':1,'1_ha':2,'1_hb':1.5,'1_ja':2,'1_jb':1,'1_jc':1,'1_b':3,'q':17,'2_pa':1.5},pr:'y',notes:'',photo:null},
    {id:2,name:'طالب تجريبي ٢',v:{'1_pa':1,'1_ha':1,'1_b':2,'q':12},pr:null,notes:'',photo:null},
    {id:3,name:'طالب تجريبي ٣',v:{},pr:null,notes:'',photo:null}]}
function save(){try{localStorage.setItem('mt1',JSON.stringify(S))}catch(e){alert('تعذر الحفظ: المساحة ممتلئة. حاول إزالة صور أو بيانات.')}}
const val=(s,k)=>s.v[k]||0;
const pSum=(s,p)=>p.gs.reduce((a,g)=>a+g.it.reduce((b,i)=>b+val(s,p.id+'_'+i[0]),0),0);
const t1=s=>pSum(s,CR[0]),t2=s=>pSum(s,CR[1])+val(s,'q'),tot=s=>t1(s)+t2(s);
const f=n=>Number.isInteger(n)?String(n):n.toFixed(1);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============= Undo ============= */
function pushUndo(){
 undoStack.push(JSON.stringify({S,sel}));
 if(undoStack.length>80) undoStack.shift();
}
function undo(){
 const st=undoStack.pop(); if(!st){toast('لا يوجد تعديل للتراجع');return}
 const d=JSON.parse(st); S=d.S; sel=d.sel; save(); all(); toast('↩️ تم التراجع');
}

/* ============= الصور ============= */
function compressImage(file, maxSize, quality){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=e=>{
   const img=new Image();
   img.onload=()=>{
    const canvas=document.createElement('canvas');
    let w=img.width,h=img.height;
    if(w>h){ if(w>maxSize){h=h*maxSize/w;w=maxSize} } else { if(h>maxSize){w=w*maxSize/h;h=maxSize} }
    canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,w,h);
    resolve(canvas.toDataURL('image/jpeg',quality));
   };
   img.onerror=()=>reject(new Error('image load error'));
   img.src=e.target.result;
  };
  reader.onerror=()=>reject(new Error('read error'));
  reader.readAsDataURL(file);
 });
}
function avatarHTML(s, size){
 const initial=esc(s.name.trim().charAt(0)||'؟');
 if(s.photo){
  return `<div class="av img" style="width:${size}px;height:${size}px;background-image:url('${s.photo}')"></div>`;
 }
 return `<div class="av" style="width:${size}px;height:${size}px">${initial}</div>`;
}
function bigAvatarHTML(s){
 const initial=esc(s.name.trim().charAt(0)||'؟');
 if(s.photo){
  return `<div class="bigav" data-a="photo" title="تغيير الصورة" style="background-image:url('${s.photo}')"><span class="cam">📷 تغيير</span></div>`;
 }
 return `<div class="bigav" data-a="photo" title="إضافة صورة">${initial}<span class="cam">📷 إضافة</span></div>`;
}
function changePhoto(id){
 const s=S.find(x=>x.id===id); if(!s)return;
 const inp=$('photoInput'); inp.value='';
 inp.onchange=async()=>{
  const file=inp.files[0]; if(!file)return;
  try{
   const data=await compressImage(file,180,0.7);
   pushUndo();
   s.photo=data; save(); all(); toast('✅ تم تحديث الصورة');
  }catch(e){ toast('تعذر تحميل الصورة'); }
  inp.onchange=null;
 };
 inp.click();
}

/* ============= الترتيب ============= */
function sorted(list){
 const c=[...list];
 if(sortMode==='name') c.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 else if(sortMode==='total-d') c.sort((a,b)=>tot(b)-tot(a));
 else if(sortMode==='total-a') c.sort((a,b)=>tot(a)-tot(b));
 return c;
}
function top3Ids(){
 if(S.length<2) return [];
 const r=[...S].sort((a,b)=>tot(b)-tot(a));
 const out=[];
 if(r[0]) out.push({id:r[0].id,b:'🥇'});
 if(r[1]&&tot(r[1])>0) out.push({id:r[1].id,b:'🥈'});
 if(r[2]&&tot(r[2])>0) out.push({id:r[2].id,b:'🥉'});
 return out;
}
function barClass(t){
 const p=t/50;
 if(p>=0.8)return 'hi';
 if(p>=0.5)return '';
 if(p>=0.3)return 'mid';
 return 'lo';
}
function renderList(){
 const L=sorted(S.filter(s=>s.name.includes(term)));
 const badges=top3Ids();
 const bmap={};badges.forEach(b=>bmap[b.id]=b.b);
 $('ls').innerHTML=L.length?L.map(s=>{
  const t=tot(s),bc=barClass(t);
  const initial=esc(s.name.trim().charAt(0)||'؟');
  const av=s.photo
   ? `<div class="av img" style="background-image:url('${s.photo}')">${bmap[s.id]?`<span class="badge">${bmap[s.id]}</span>`:''}</div>`
   : `<div class="av">${initial}${bmap[s.id]?`<span class="badge">${bmap[s.id]}</span>`:''}</div>`;
  return `<button class="stu ${s.id===sel?'on':''}" data-id="${s.id}">
  ${av}
  <div class="n"><b>${esc(s.name)}</b><div class="bar ${bc}"><i style="width:${Math.min(100,t/50*100)}%"></i></div></div>
  <div class="tot ${bc==='hi'?'hi':bc==='lo'?'lo':''}">${f(t)}<small>/50</small></div></button>`}).join(''):'<div class="empty">لا يوجد طلاب. اضغط «+ طالب» للإضافة.</div>';
}
function stepper(s,k,mx,step){
 const v=s.v[k];
 return `<div class="st"><button data-a="m" data-k="${k}" data-s="${step}" aria-label="إنقاص">−</button><output>${v===undefined?'–':f(v)}<small>/${mx}</small></output><button data-a="p" data-k="${k}" data-s="${step}" data-mx="${mx}" aria-label="زيادة">+</button></div>`;
}
function renderDetail(){
 const s=S.find(x=>x.id===sel),box=$('dt');
 $('app').classList.toggle('sel',!!s);
 if(!s){box.innerHTML='<div class="empty" style="margin-top:20vh">اختر طالباً من القائمة لعرض تفاصيل درجاته<br><br><small style="font-size:12px">اختصارات: ↑↓ للتنقل، Esc للرجوع</small></div>';return}
 const y=box.scrollTop;
 let h=`<div class="hd"><button class="ib back" data-a="back">‹ رجوع</button><h2>${esc(s.name)}</h2>
 <button class="ib wa" data-a="wa" title="مشاركة واتساب">💬</button>
 <button class="ib" data-a="prs" title="طباعة">🖨</button>
 <button class="ib" data-a="ren" title="تعديل الاسم">✏️</button>
 <button class="ib" data-a="del" style="color:var(--bad)" title="حذف">🗑</button></div>
 ${bigAvatarHTML(s)}
 <div class="tiles"><div class="tile"><div class="v">${f(t1(s))}<small>/15</small></div><div class="l">الأسابيع 1–6</div></div>
 <div class="tile"><div class="v">${f(t2(s))}<small>/35</small></div><div class="l">اختبار قصير + 7–12</div></div>
 <div class="tile big"><div class="v">${f(tot(s))}<small>/50</small></div><div class="l">أعمال الفصل</div></div></div>`;
 CR.forEach((p,pi)=>{
  h+=`<section class="card"><h3><span>${p.title}</span><span>${f(pSum(s,p))}/15</span></h3>`;
  if(pi===1)h+=`<div class="g"><b>الاختبار القصير – الأسبوع السابع (حصة كاملة)</b><div class="it"><span>درجة الاختبار</span>${stepper(s,'q',QMAX,1)}</div></div>`;
  p.gs.forEach(g=>{h+=`<div class="g"><b>${g.t}</b>`+g.it.map(i=>`<div class="it"><span>${i[1]}</span>${stepper(s,p.id+'_'+i[0],i[2],0.5)}</div>`).join('')+`</div>`});
  if(pi===0)h+=`<div class="g"><b>تقرير ولي الأمر – الأسبوع السادس</b><div class="it"><span>حالة التقرير</span><div class="seg"><button class="${s.pr==='y'?'y':''}" data-a="pr" data-v="y">✓ تم</button><button class="${s.pr==='x'?'x':''}" data-a="pr" data-v="x">✗ لم يتم</button></div></div></div>`;
  h+='</section>';
 });
 h+=`<section class="card"><h3><span>📝 ملاحظات المعلم</span></h3>
 <textarea class="notes" id="notes_${s.id}" placeholder="اكتب ملاحظاتك عن الطالب هنا (تُحفظ تلقائياً وتظهر في التقارير)...">${esc(s.notes||'')}</textarea></section>`;
 h+='<div class="hint">درجة امتحان نهاية الفصل غير مدرجة. تُحفظ البيانات تلقائياً على هذا الجهاز.<br>Ctrl+Z للتراجع • ↑↓ للتنقل بين الطلاب • Esc للرجوع</div>';
 box.innerHTML=h;box.scrollTop=y;
 const ta=$('notes_'+s.id);
 if(ta){ta.addEventListener('input',()=>{s.notes=ta.value;save()})}
}
function all(){renderList();renderDetail()}

 else if(a==='wa'){shareWA(s)}

function shareWA(s){
 const lines=[
  `📊 *تقرير درجات الرياضيات*`,
  ``,
  `👤 الطالب: *${s.name}*`,
  `📅 الفصل الدراسي الأول 2026/2027`,
  ``,
  `*الأسابيع 1–6:*`,
  `  المجموع: ${f(t1(s))} / 15`,
  ``,
  `*اختبار قصير + الأسابيع 7–12:*`,
  `  المجموع: ${f(t2(s))} / 35`,
  ``,
  `*إجمالي أعمال الفصل:*`,
  `  ${f(tot(s))} / 50`,
  ``,
  `النسبة: ${(tot(s)/50*100).toFixed(1)}%`,
  s.notes ? `\n📝 ملاحظات: ${s.notes}` : ''
 ].filter(Boolean).join('\n');
 window.open('https://wa.me/?text='+encodeURIComponent(lines),'_blank');
}

$('stats').onclick=()=>{

 const avg=sum/totals.length;

 const pass=totals.filter(t=>t>=25).length;
 const ex=totals.filter(t=>t>=45).length;
 const good=totals.filter(t=>t>=35&&t<45).length;

 const low=totals.filter(t=>t<25).length;
 const sorted_=[...S].sort((a,b)=>tot(b)-tot(a));

  {r:'⭐ جيد (35-44.5)',n:good,c:'',max:S.length},
  {r:'📗 مقبول (25-34.5)',n:mid,c:'w',max:S.length},
  {r:'📕 ضعيف (< 25)',n:low,c:'b',max:S.length}
 ];
 let h=`
 <div class="stat-grid">
   <div class="stat-t"><div class="sv">${S.length}</div><div class="sl">عدد الطلاب</div></div>
   <div class="stat-t"><div class="sv">${avg.toFixed(1)}</div><div class="sl">المتوسط</div></div>
   <div class="stat-t"><div class="sv">${f(mx)}</div><div class="sl">الأعلى</div></div>
   <div class="stat-t"><div class="sv">${f(mn)}</div><div class="sl">الأدنى</div></div>
   <div class="stat-t"><div class="sv">${((pass/totals.length)*100).toFixed(0)}%</div><div class="sl">نسبة النجاح</div></div>
 </div>
 <h4 style="margin:14px 0 10px;color:var(--pri)">📊 توزيع المستويات</h4>
 <div class="dist">`;
 ranks.forEach(r=>{
  const pct=r.max?r.n/r.max*100:0;
  h+=`<div class="dist-row ${r.c}"><span>${r.r}</span><div class="dist-bar"><i style="width:${pct}%"></i></div><span style="text-align:center">${r.n}</span></div>`;
 });
 h+=`</div>`;
 if(S.length>=2){
  h+=`<h4 style="margin:14px 0 10px;color:var(--pri)">🥇 أعلى 5 طلاب</h4><div class="top3">`;
  const medals=['🥇','🥈','🥉','4️⃣','5️⃣'];
  sorted_.slice(0,5).forEach((s,i)=>{
   h+=`<div class="top3-row"><span style="font-size:20px">${medals[i]}</span><b>${esc(s.name)}</b><span style="color:var(--pri);font-weight:800">${f(tot(s))}/50</span></div>`;
  });
  h+=`</div>`;
 }
 $('statsBody').innerHTML=h;
 $('statsDlg').showModal();
};

/* ============= اختصارات ============= */
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
 const tgt=e.target;
 const typing=/INPUT|TEXTAREA|SELECT/.test(tgt.tagName);
 if(e.key==='Escape'&&sel&&!document.querySelector('dialog[open]')){sel=null;all();return}
 if(typing)return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){
  e.preventDefault();
  const list=sorted(S.filter(s=>s.name.includes(term)));
  if(!list.length)return;
  const i=list.findIndex(s=>s.id===sel);
  let ni;
  if(e.key==='ArrowDown') ni=i<0?0:Math.min(list.length-1,i+1);
  else ni=i<0?list.length-1:Math.max(0,i-1);
  sel=list[ni].id;all();
 }
});

function addNames(L){const have=new Set(S.map(s=>s.name));let n=0;
 pushUndo();
 L.forEach((x,i)=>{if(!have.has(x)){have.add(x);S.push({id:Date.now()+i,name:x,v:{},pr:null,notes:'',photo:null});n++}});
 save();all();msg(n?('تمت إضافة '+n+' طالب'):'لا توجد أسماء جديدة');return n}
function namesFromRows(rows){let col=-1,start=0;
 for(let i=0;i<rows.length&&col<0;i++)(rows[i]||[]).forEach((c,j)=>{if(col<0&&typeof c==='string'&&c.trim()==='اسم الطالب'){col=j;start=i+1}});
 if(col<0){const cnt={};rows.forEach(r=>(r||[]).forEach((c,j)=>{if(typeof c==='string'&&c.trim())cnt[j]=(cnt[j]||0)+1}));
  const k=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];if(k===undefined)return[];col=+k}
 return rows.slice(start).map(r=>r&&r[col]).filter(c=>typeof c==='string').map(c=>c.trim()).filter(c=>c&&c!=='اسم الطالب'&&c!=='م')}
$('imp').onclick=()=>$('fi').click();

 if(!window.XLSX){msg('تعذر تحميل مكتبة الإكسل. تحقق من الاتصال بالإنترنت.');return}
 const rd=new FileReader(),csv=/\.csv$/i.test(fl.name);
 rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:csv?'string':'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  const L=namesFromRows(rows);if(!L.length)msg('لم أجد أسماء في الملف.');else addNames(L)}catch(x){msg('تعذرت قراءة الملف.')}
  e.target.value=''};
 csv?rd.readAsText(fl):rd.readAsArrayBuffer(fl)};
$('pa').onclick=()=>{const L=$('ta').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!L.length){msg('الصق الأسماء أولاً.');return}if(addNames(L)>=0)$('ta').value=''};

/* ============= التصدير إلى Excel (يعمل على أي موقع) ============= */
function downloadBlob(blob, filename){
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url; a.download=filename;
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

$('ex').onclick=()=>{
 if(!window.XLSX){msg('تعذر تحميل مكتبة الإكسل. تحقق من الاتصال بالإنترنت.');return}
 if(!S.length){msg('لا يوجد طلاب للتصدير.');return}
 const H=['م','اسم الطالب'];
 const items=p=>CR[p].gs.flatMap(g=>g.it);
 items(0).forEach(i=>H.push('1-6: '+i[1]+' ('+i[2]+')'));
 H.push('مجموع 1-6 (15)','تقرير ولي الأمر (6)','الاختبار القصير (20)');
 items(1).forEach(i=>H.push('7-12: '+i[1]+' ('+i[2]+')'));
 H.push('مجموع 7-12 (15)','اختبار قصير + 7-12 (35)','إجمالي أعمال الفصل (50)','ملاحظات');
 const A=[H];
 S.forEach((s,r)=>{const R=r+2,row=[r+1,s.name];
  items(0).forEach(i=>row.push(s.v['1_'+i[0]]||0));
  row.push({t:'n',v:t1(s),f:'SUM(C'+R+':K'+R+')'},s.pr==='y'?'✓':s.pr==='x'?'✗':'',s.v.q||0);
  items(1).forEach(i=>row.push(s.v['2_'+i[0]]||0));
  const o=pSum(s,CR[1]);
  row.push({t:'n',v:o,f:'SUM(O'+R+':W'+R+')'},{t:'n',v:val(s,'q')+o,f:'SUM(N'+R+',X'+R+')'},{t:'n',v:tot(s),f:'SUM(L'+R+',Y'+R+')'},s.notes||'');A.push(row)});
 const ws=XLSX.utils.aoa_to_sheet(A);
 ws['!cols']=[{wch:5},{wch:26}].concat(Array(H.length-3).fill({wch:13})).concat([{wch:30}]);
 const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
 XLSX.utils.book_append_sheet(wb,ws,'الدرجات');
 try{
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const d=new Date().toISOString().slice(0,10);
  downloadBlob(blob,`متابعة_درجات_الرياضيات_${d}.xlsx`);
  msg('✅ تم تنزيل الملف بنجاح');
 }catch(e){ msg('تعذر إنشاء الملف: '+e.message); }
};

 CR[p].gs.forEach(g=>{
  if(g.it.length===1){r2+=`<th rowspan="2"><div class="v">${g.it[0][1]} (${g.it[0][2]})</div></th>`}
  else{r2+=`<th colspan="${g.it.length}">${g.t}</th>`;g.it.forEach(i=>{r3+=`<th><div class="v">${SH[i[0]]||i[1]} (${i[2]})</div></th>`})}
 });
 r2+=`<th rowspan="2" class="tt"><div class="v">المجموع (15)</div></th>`;
 const totalCols=CR[p].gs.reduce((a,g)=>a+g.it.length,0);
 const top=`<tr><th rowspan="3">م</th><th rowspan="3">اسم الطالب</th><th colspan="${totalCols}">${CR[p].title} (15 درجة)</th>${p===0?'<th rowspan="3"><div class="v">تقرير ولي الأمر (أسبوع 6)</div></th>':''}<th rowspan="3" class="tt"><div class="v">مجموع الفترة</div></th></tr><tr>${r2}</tr><tr>${r3}</tr>`;
 const rows=S.map((s,i)=>{
  let c=`<td>${i+1}</td><td class="n avatar-cell">${s.photo?`<img src="${s.photo}" alt=""> `:''}${esc(s.name)}</td>`;
  CR[p].gs.forEach(g=>g.it.forEach(it=>{c+=`<td>${cv(s.v[CR[p].id+'_'+it[0]])}</td>`}));
  if(p===0)c+=`<td>${s.pr==='y'?'✓':s.pr==='x'?'✗':''}</td>`;
  c+=`<td class="tt">${has(s,CR[p].id+'_')?f(pSum(s,CR[p])):''}</td>`;
  return `<tr>${c}</tr>`}).join('');
 return `<table>${top}${rows}</table>`;
}

function summaryTableHTML(){
 const top=`<tr>
  <th rowspan="2">م</th>
  <th rowspan="2">اسم الطالب</th>
  <th>الأسابيع 1–6</th>
  <th>الاختبار القصير</th>
  <th>الأسابيع 7–12</th>
  <th>مجموع (قصير + 7–12)</th>
  <th class="tt">الإجمالي /50</th>
  <th>النسبة</th>
 </tr>
 <tr>
  <th>(15)</th><th>(20)</th><th>(15)</th><th>(35)</th><th>(50)</th><th>%</th>
 </tr>`;
 const rows=S.map((s,i)=>{
  const p2=pSum(s,CR[1]);
  const t=tot(s);
  const pct=(t/50*100).toFixed(1);
  return `<tr>
   <td>${i+1}</td>
   <td class="n avatar-cell">${s.photo?`<img src="${s.photo}" alt=""> `:''}${esc(s.name)}</td>
   <td>${has(s,'1_')?f(t1(s)):''}</td>
   <td>${s.v.q!==undefined?f(s.v.q):''}</td>
   <td>${has(s,'2_')?f(p2):''}</td>
   <td>${(s.v.q!==undefined||has(s,'2_'))?f((s.v.q||0)+p2):''}</td>
   <td class="tt">${Object.keys(s.v).length?f(t):''}</td>
   <td>${Object.keys(s.v).length?pct+'%':''}</td>
  </tr>`}).join('');
 return `<table>${top}${rows}</table>`;
}

function stuHTML(s){
 const pt=p=>{let r=`<table class="brk"><tr><th colspan="2">${CR[p].title}</th><th>الدرجة</th><th>العظمى</th><th style="width:28%">النسبة</th></tr>`;
  const row=(n,v,m)=>`<tr><td class="n" colspan="2">${n}</td><td>${v===undefined?'–':f(v)}</td><td>${f(m)}</td><td><div class="bar"><i style="width:${Math.min(100,(v||0)/m*100)}%"></i></div></td></tr>`;
  if(p===1)r+=`<tr><td class="gh" colspan="5">الاختبار القصير – الأسبوع السابع</td></tr>`+row('درجة الاختبار',s.v.q,20);
  CR[p].gs.forEach(g=>{r+=`<tr><td class="gh" colspan="5">${g.t}</td></tr>`;g.it.forEach(i=>{r+=row(i[1],s.v[CR[p].id+'_'+i[0]],i[2])})});
  if(p===0)r+=`<tr><td class="gh" colspan="5">تقرير ولي الأمر – الأسبوع السادس</td></tr><tr><td class="n" colspan="2">حالة التقرير</td><td colspan="3">${s.pr==='y'?'✓ تم':s.pr==='x'?'✗ لم يتم':'—'}</td></tr>`;
  const sm=p===0?t1(s):pSum(s,CR[1]);
  r+=`<tr class="tt"><td class="n" colspan="2">المجموع</td><td>${f(sm)}</td><td>15</td><td></td></tr></table>`;return r};
 return `<div class="rp">
  ${head('تقرير متابعة الطالب – الفصل الدراسي الأول 2026/2027م','')}
  ${s.photo?`<img class="stu-photo" src="${s.photo}" alt="">`:''}
  <div class="nm">الطالب: ${esc(s.name)}</div>
  <div class="boxes">
   <div class="box"><b>${f(t1(s))}/15</b>الأسابيع 1–6</div>
   <div class="box"><b>${f(t2(s))}/35</b>اختبار قصير + 7–12</div>
   <div class="box g"><b>${f(tot(s))}/50</b>إجمالي أعمال الفصل</div>
  </div>
  ${pt(0)}${pt(1)}
  <div class="notes">ملاحظات المعلم: ${esc(s.notes||'')}</div>
  <div class="sig"><span>المعلم: ....................</span><span>ولي الأمر: ....................</span></div>
 </div>`;
}

function build(){const s=S.find(x=>x.id===sel);if(pk==='student'&&s)return{h:stuHTML(s),land:false,name:'تقرير_'+s.name.replace(/\s+/g,'_')};return{h:classHTML(),land:true,name:'كشف_درجات_الرياضيات'}}
const sty=land=>`<style>@page{size:A4 ${land?'landscape':'portrait'};margin:8mm}${RC}</style>`;
function printNow(){saveInfo();const b=build();$('pdlg').close();$('pt').innerHTML=sty(b.land)+b.h;document.body.classList.add('pa');doPrint()}

async function printSave(){
 saveInfo();
 const b=build();
 const html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${b.name}</title><style>body{margin:0;padding:12px;background:#fff}</style></head><body><div id="pt">${sty(b.land)}${b.h}</div><script>window.onload=function(){setTimeout(function(){window.print()},500)}<\/script></body></html>`;
 const blob=new Blob([html],{type:'text/html;charset=utf-8'});
 downloadBlob(blob,b.name+'.html');
 $('pmsg').textContent='✅ تم تنزيل الملف. افتحه في المتصفح ليظهر مربع الطباعة (ومنها يمكن الحفظ كـ PDF).';
}

function syncP(){const h=!!S.find(x=>x.id===sel);$('pst').disabled=!h;if(!h&&pk==='student')pk='class';document.querySelectorAll('#pdlg .chip').forEach(b=>b.classList.toggle('on',b.dataset.k===pk))}
function openPrint(k){pk=k;const I=info();$('pc').value=I.c||'';$('pteach').value=I.t||'';$('pmsg').textContent='';syncP();$('pdlg').showModal()}
document.querySelectorAll('#pdlg .chip').forEach(b=>b.onclick=()=>{if(!b.disabled){pk=b.dataset.k;syncP()}});
$('pnow').onclick=printNow;$('psave').onclick=printSave;$('pcl').onclick=()=>$('pdlg').close();

load();all();
</script>
